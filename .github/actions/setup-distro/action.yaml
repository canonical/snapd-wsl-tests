name: Setup WSL wsl-distro-name
author: Zygmunt Krynicki
description: |
  Download a WSL wsl-distro-name rootfs, import it into the system, optionally
  enable systemd, and initialize by hand.
inputs:
  wsl-distro-name:
    description: Name of wsl-distro-name instance
    required: true
  wsl-rootfs-url:
    description: URL of the root file system to import
    required: true
  wsl-rootfs-file:
    description: Name the root file system to import
    required: true
  wsl-rootfses-dir:
    description: Directory where downloaded root file systems are stored
    default: wsl-rootfses
    required: false
  wsl-vms-dir:
    description: Directory where imported virtual machine disks are stored
    default: wsl-vms
    required: false
  wsl-enable-systemd:
    description: Explicitly enable systemd boot in the wsl-distro-name
    required: false
    default: "false"
outputs:
  wsl-workspace-path:
    description: Path of the GitHub workspace inside WSL
    value: ${{ steps.setup-workspace-symlink.outputs.wsl-workspace-path }}

branding:
  icon: cloud
  color: orange
runs:
  using: composite
  steps:
    - name: Cache ${{ inputs.wsl-rootfs-file }} WSL RootFS
      id: cache-rootfs
      uses: actions/cache@v6
      with:
        path: ${{ inputs.wsl-rootfses-dir }}/${{ inputs.wsl-rootfs-file }}
        key: rootfs/${{ inputs.wsl-rootfs-file }}

    - name: Download ${{ inputs.distro-name }} WSL RootFS
      shell: pwsh
      if: ${{ steps.cache-rootfs.outputs.cache-hit != 'true' }}
      env:
        WSL_ROOTFSES_DIR: ${{ inputs.wsl-rootfses-dir }}
        WSL_ROOTFS_URL: ${{ inputs.wsl-rootfs-url }}
        WSL_ROOTFS_FILE: ${{ inputs.wsl-rootfs-file }}
      run: |
        Set-StrictMode -version latest

        if ( -not ( Test-Path -PathType Container -LiteralPath ${Env:WSL_ROOTFSES_DIR} ) ) {
          New-Item -ItemType Directory -Name ${Env:WSL_ROOTFSES_DIR}
        }

        Write-Output "Downloading ${Env:WSL_ROOTFS_URL}..."
        $ProgressPreference = 'SilentlyContinue'
        Invoke-WebRequest -Uri "${Env:WSL_ROOTFS_URL}" -OutFile "${Env:WSL_ROOTFSES_DIR}\${Env:WSL_ROOTFS_FILE}" -UseBasicParsing
        if ( ! $? ) {
          exit 1
        }

    - name: Import ${{ inputs.wsl-rootfs-file }} into WSL as ${{ inputs.wsl-distro-name }}
      shell: pwsh
      env:
        WSL_DISTRO_NAME: ${{ inputs.wsl-distro-name }}
        WSL_ROOTFSES_DIR: ${{ inputs.wsl-rootfses-dir }}
        WSL_ROOTFS_FILE: ${{ inputs.wsl-rootfs-file }}
        WSL_VMS_DIR: ${{ inputs.wsl-vms-dir }}
      run: |
        Set-StrictMode -version latest

        if ( -not ( Test-Path -PathType Container -LiteralPath ${Env:WSL_VMS_DIR} ) ) {
          New-Item -ItemType Directory -Name ${Env:WSL_VMS_DIR}
        }

        function Invoke-WslDiagnosticCommand {
          param(
            [Parameter(Mandatory = $true)]
            [string] $Label,
            [Parameter(Mandatory = $true)]
            [string[]] $Arguments
          )

          Write-Output $Label
          try {
            & wsl.exe @Arguments 2>&1 | ForEach-Object { Write-Output $_ }
            Write-Output "Exit code: $LASTEXITCODE"
          } catch {
            Write-Warning "${Label} failed: $($_.Exception.Message)"
          }
          Write-Output ""
        }

        function Show-RecentEventLog {
          param(
            [Parameter(Mandatory = $true)]
            [string] $LogName,
            [Parameter(Mandatory = $true)]
            [datetime] $StartTime,
            [int] $MaxEvents = 20
          )

          Write-Output "Recent events from ${LogName}:"
          try {
            $log = Get-WinEvent -ListLog $LogName -ErrorAction Stop
            if (-not $log.IsEnabled) {
              Write-Output "Log ${LogName} is disabled."
              Write-Output ""
              return
            }
            $events = @(Get-WinEvent -FilterHashtable @{ LogName = $LogName; StartTime = $StartTime } -MaxEvents $MaxEvents -ErrorAction Stop)
            if ($events.Count -eq 0) {
              Write-Output "No recent events."
            } else {
              $events |
                Select-Object TimeCreated, Id, LevelDisplayName, ProviderName, Message |
                Format-List |
                Out-String -Width 220 -Stream |
                ForEach-Object { Write-Output $_ }
            }
          } catch {
            Write-Warning "Unable to read log ${LogName}: $($_.Exception.Message)"
          }
          Write-Output ""
        }

        function Show-RecentEventLogByProvider {
          param(
            [Parameter(Mandatory = $true)]
            [string] $LogName,
            [Parameter(Mandatory = $true)]
            [string[]] $ProviderName,
            [Parameter(Mandatory = $true)]
            [datetime] $StartTime,
            [int] $MaxEvents = 20
          )

          Write-Output "Recent events from ${LogName} for providers: $($ProviderName -join ', ')"
          try {
            $events = @(Get-WinEvent -FilterHashtable @{
              LogName = $LogName
              ProviderName = $ProviderName
              StartTime = $StartTime
            } -MaxEvents $MaxEvents -ErrorAction Stop)
            if ($events.Count -eq 0) {
              Write-Output "No recent events."
            } else {
              $events |
                Select-Object TimeCreated, Id, LevelDisplayName, ProviderName, Message |
                Format-List |
                Out-String -Width 220 -Stream |
                ForEach-Object { Write-Output $_ }
            }
          } catch {
            Write-Warning "Unable to read ${LogName} events for providers $($ProviderName -join ', '): $($_.Exception.Message)"
          }
          Write-Output ""
        }

        function Show-WslImportDiagnostics {
          param(
            [Parameter(Mandatory = $true)]
            [string] $Reason
          )

          $diagnosticWindowStart = (Get-Date).AddMinutes(-15)
          $vmPath = ".\${Env:WSL_VMS_DIR}\${Env:WSL_DISTRO_NAME}"
          $rootfsPath = ".\${Env:WSL_ROOTFSES_DIR}\${Env:WSL_ROOTFS_FILE}"

          Write-Output "::group::WSL import diagnostics (${Reason})"
          Write-Output "Timestamp: $(Get-Date -Format o)"
          Write-Output "WSL distro: ${Env:WSL_DISTRO_NAME}"
          Write-Output "WSL VM path: $vmPath"
          Write-Output "WSL rootfs path: $rootfsPath"
          Write-Output ""

          Write-Output "WSL service state:"
          Get-Service -Name WslService, LxssManager -ErrorAction SilentlyContinue |
            Select-Object Name, Status, StartType |
            Format-Table -AutoSize |
            Out-String -Width 220 -Stream |
            ForEach-Object { Write-Output $_ }
          Write-Output ""

          Write-Output "WSL-related processes:"
          Get-Process -Name wsl, wslservice -ErrorAction SilentlyContinue |
            Select-Object Name, Id, StartTime, Path |
            Format-Table -AutoSize |
            Out-String -Width 220 -Stream |
            ForEach-Object { Write-Output $_ }
          Write-Output ""

          Write-Output "WSL filesystem state:"
          Get-Item -LiteralPath $rootfsPath -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-List |
            Out-String -Width 220 -Stream |
            ForEach-Object { Write-Output $_ }
          Get-ChildItem -Force -LiteralPath $vmPath -ErrorAction SilentlyContinue |
            Select-Object Mode, LastWriteTime, Length, Name |
            Format-Table -AutoSize |
            Out-String -Width 220 -Stream |
            ForEach-Object { Write-Output $_ }
          Write-Output ""

          Invoke-WslDiagnosticCommand -Label "wsl.exe --version" -Arguments @("--version")
          Invoke-WslDiagnosticCommand -Label "wsl.exe --status" -Arguments @("--status")
          Invoke-WslDiagnosticCommand -Label "wsl.exe --list --verbose" -Arguments @("--list", "--verbose")

          Show-RecentEventLog -LogName "Microsoft-Windows-Lxss/Operational" -StartTime $diagnosticWindowStart
          Show-RecentEventLog -LogName "Microsoft-Windows-Hyper-V-Compute-Admin" -StartTime $diagnosticWindowStart
          Show-RecentEventLog -LogName "Microsoft-Windows-Hyper-V-Compute-Operational" -StartTime $diagnosticWindowStart
          Show-RecentEventLogByProvider -LogName "Application" -ProviderName @("Application Error", "Windows Error Reporting") -StartTime $diagnosticWindowStart
          Show-RecentEventLogByProvider -LogName "System" -ProviderName @("Service Control Manager") -StartTime $diagnosticWindowStart

          Write-Output "::endgroup::"
        }

        Write-Output "Importing ${Env:WSL_ROOTFSES_DIR}\${Env:WSL_ROOTFS_FILE} RootFS into WSL..."
        $maxAttempts = 3
        $imported = $false
        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          if ($attempt -gt 1) {
            Write-Output "Retrying WSL import (attempt $attempt of $maxAttempts)..."
            Write-Output "Cleaning up partial import state..."
            $unregisterOutput = wsl --unregister "${Env:WSL_DISTRO_NAME}" 2>&1
            if ($LASTEXITCODE -ne 0) {
              $unregisterMessage = ($unregisterOutput | Out-String)
              if ($unregisterMessage -notmatch '(?i)there is no distribution with the supplied name|distribution.*not found|was not found') {
                Show-WslImportDiagnostics -Reason "unexpected unregister failure after import attempt $($attempt - 1)"
                Write-Error "Failed to unregister WSL distro ${Env:WSL_DISTRO_NAME}: $unregisterMessage"
                exit 1
              }
              Write-Output "WSL distro ${Env:WSL_DISTRO_NAME} was already unregistered."
            }
            $vmPath = ".\${Env:WSL_VMS_DIR}\${Env:WSL_DISTRO_NAME}"
            if (Test-Path -PathType Container -LiteralPath $vmPath) {
              Remove-Item -Recurse -Force -LiteralPath $vmPath
            }
            $wslService = $null
            foreach ($serviceName in @('WslService', 'LxssManager')) {
              $candidateService = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
              if ($null -ne $candidateService) {
                $wslService = $candidateService
                break
              }
            }
            if ($null -eq $wslService) {
              Write-Warning "Failed to find a WSL management service (checked: WslService, LxssManager). Subsequent import attempts may still fail."
            } else {
              Write-Output "Restarting WSL service $($wslService.Name) to recover from connection error..."
              try {
                Restart-Service -InputObject $wslService -Force -ErrorAction Stop
                $wslService = Get-Service -Name $wslService.Name -ErrorAction Stop
                if ($wslService.Status -ne 'Running') {
                  Write-Warning "WSL service restart completed but $($wslService.Name) is '$($wslService.Status)'; subsequent import attempts may still fail."
                } else {
                  Write-Output "WSL service $($wslService.Name) is running after restart."
                }
              } catch {
                Write-Warning "Failed to restart WSL service $($wslService.Name): $($_.Exception.Message). Subsequent import attempts may still fail."
              }
            }
            Start-Sleep -Seconds 10
          }
          wsl `
            --import "${Env:WSL_DISTRO_NAME}" `
            ".\${Env:WSL_VMS_DIR}\${Env:WSL_DISTRO_NAME}" `
            ".\${Env:WSL_ROOTFSES_DIR}\${Env:WSL_ROOTFS_FILE}" `
            --version 2
          if ($?) {
            $imported = $true
            break
          }
          Show-WslImportDiagnostics -Reason "import attempt $attempt of $maxAttempts failed"
          Write-Warning "WSL import attempt $attempt of $maxAttempts failed."
        }
        if ( -not $imported ) {
          Write-Error "Cannot import ${Env:WSL_DISTRO_NAME} into WSL."
          exit 1
        }

    - name: Configure ${{ inputs.wsl-distro-name }} to use Systemd
      shell: pwsh
      if: ${{ fromJSON(inputs.wsl-enable-systemd) }}
      env:
        WSL_DISTRO_NAME: ${{ inputs.wsl-distro-name }}
      run: |
        Set-StrictMode -version latest

        # As ironic as this is, WSL-specific init process cannot cope with \r\n
        # line endings in the /etc/wsl.conf initialization file. Read and write
        # bytes directly so existing content is preserved while the [boot]
        # systemd=true setting is updated semantically.
        $wslConfPath = "\\wsl.localhost\${Env:WSL_DISTRO_NAME}\etc\wsl.conf"
        $currentWslConf = ""
        if (Test-Path -PathType Leaf -LiteralPath $wslConfPath) {
          $currentWslConf = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($wslConfPath))
        }
        $currentWslConf = $currentWslConf.Replace("`r`n", "`n").Replace("`r", "`n")

        $updatedLines = [System.Collections.Generic.List[string]]::new()
        $bootSectionFound = $false
        $inBootSection = $false
        $systemdSet = $false

        $currentLines = @()
        if ($currentWslConf -ne "") {
          $currentLines = $currentWslConf -split "`n"
        }

        foreach ($line in $currentLines) {
          if ($line -match '^\s*\[(.+)\]\s*$') {
            if ($inBootSection -and -not $systemdSet) {
              $updatedLines.Add("systemd=true")
              $systemdSet = $true
            }
            $inBootSection = $Matches[1] -ieq "boot"
            if ($inBootSection) {
              $bootSectionFound = $true
            }
            $updatedLines.Add($line)
            continue
          }

          if ($inBootSection -and $line -match '^\s*systemd\s*=') {
            if (-not $systemdSet) {
              $updatedLines.Add("systemd=true")
              $systemdSet = $true
            }
            continue
          }

          $updatedLines.Add($line)
        }

        if ($inBootSection -and -not $systemdSet) {
          $updatedLines.Add("systemd=true")
          $systemdSet = $true
        }

        if (-not $bootSectionFound) {
          if ($updatedLines.Count -gt 0 -and $updatedLines[$updatedLines.Count - 1] -ne "") {
            $updatedLines.Add("")
          }
          $updatedLines.Add("[boot]")
          $updatedLines.Add("systemd=true")
        }

        $wslConf = ($updatedLines -join "`n").TrimEnd("`n") + "`n"

        Write-Output "Enabling systemd boot in ${Env:WSL_DISTRO_NAME}..."
        [System.IO.File]::WriteAllBytes($wslConfPath, [System.Text.Encoding]::UTF8.GetBytes($wslConf))
        if ( ! $? ) {
          Write-Error "Cannot enable systemd boot in ${Env:WSL_DISTRO_NAME}."
          exit 1
        }

        type "\\wsl.localhost\${Env:WSL_DISTRO_NAME}\etc\wsl.conf"
        wsl --distribution "${Env:WSL_DISTRO_NAME}" --exec od -t c /etc/wsl.conf

        Write-Output "Terminating ${Env:WSL_DISTRO_NAME} for earlier changes to take effect..."
        wsl --terminate "${Env:WSL_DISTRO_NAME}"
        if ( ! $? ) {
          Write-Error "Cannot terminate ${Env:WSL_DISTRO_NAME} instance."
          exit 1
        }

        Write-Output "Checking if systemd is running"
        $systemdState = @(
          wsl `
            --distribution "${Env:WSL_DISTRO_NAME}" `
            --user root `
            --cd / `
            --exec /bin/sh -lc 'state="$(systemctl is-system-running --wait || true)"; printf "%s\n" "$state"; case "$state" in running|degraded) exit 0 ;; *) exit 1 ;; esac'
        )
        $systemdProbeExitCode = $LASTEXITCODE
        $systemdState = ($systemdState | Select-Object -Last 1).Trim()

        function Show-FailedSystemdUnitDiagnostics {
          $failedUnits = @(
            wsl `
              --distribution "${Env:WSL_DISTRO_NAME}" `
              --user root `
              --cd / `
              --exec /bin/sh -lc "systemctl --failed --plain --no-legend --no-pager --full | awk 'NF { print `$1 }'"
          )
          $failedUnits = @(
            $failedUnits |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -ne "" }
          )

          if ($failedUnits.Count -eq 0) {
            Write-Output "No failed systemd units reported."
            return
          }

          foreach ($failedUnit in $failedUnits) {
            Write-Output "Recent journal for failed unit ${failedUnit}:"
            wsl `
              --distribution "${Env:WSL_DISTRO_NAME}" `
              --user root `
              --cd / `
              --exec journalctl --no-pager -b -u "${failedUnit}"
          }
        }

        if ($systemdState -eq "degraded") {
          Write-Warning "systemd reached a degraded state in ${Env:WSL_DISTRO_NAME}; continuing and printing failed units for diagnostics."
          wsl `
            --distribution "${Env:WSL_DISTRO_NAME}" `
            --user root `
            --cd / `
            --exec systemctl --failed --no-pager --full
          Show-FailedSystemdUnitDiagnostics
        } elseif ( $systemdProbeExitCode -ne 0 ) {
          Write-Error "systemd did not reach a usable state in ${Env:WSL_DISTRO_NAME} (state: $systemdState)."
          wsl `
            --distribution "${Env:WSL_DISTRO_NAME}" `
            --user root `
            --cd / `
            --exec systemctl --failed --no-pager --full
          Show-FailedSystemdUnitDiagnostics
          exit 1
        }

    - name: Setup ${{ inputs.distro-name }} WSL instance
      shell: pwsh
      env:
        WSL_DISTRO_NAME: ${{ inputs.wsl-distro-name }}
      run: |
        Set-StrictMode -version latest

        $maxAttempts = 3
        $setupDone = $false
        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          if ($attempt -gt 1) {
            Write-Output "Retrying WSL instance setup (attempt $attempt of $maxAttempts)..."
            wsl --terminate "${Env:WSL_DISTRO_NAME}"
            Start-Sleep -Seconds 10
          }

          Write-Output "Adding system group for docker."
          wsl `
            --distribution "${Env:WSL_DISTRO_NAME}" `
            --user root `
            --cd / `
            groupadd --force --system docker
          if ( ! $? ) {
            Write-Warning "Failed to add docker system group."
            continue
          }

          Write-Output "Adding system group for LXD."
          wsl `
            --distribution "${Env:WSL_DISTRO_NAME}" `
            --user root `
            --cd / `
            groupadd --force --system lxd
          if ( ! $? ) {
            Write-Warning "Failed to add lxd system group."
            continue
          }

          Write-Output "Adding test user 'user'."
          wsl `
            --distribution "${Env:WSL_DISTRO_NAME}" `
            --user root `
            --cd / `
            bash -c "id user > /dev/null 2>&1 || useradd --create-home --skel /etc/skel --groups users,admin,lxd,docker --shell=/bin/bash user"
          if ( ! $? ) {
            Write-Warning "Failed to add test user 'user'."
            continue
          }

          Write-Output "Allow test user 'user' to use sudo."
          Set-Content `
            -LiteralPath \\wsl.localhost\${Env:WSL_DISTRO_NAME}\etc\sudoers.d\user.conf `
            -Value "user ALL= NOPASSWD: ALL"
          if ( ! $? ) {
            Write-Warning "Failed to allow test user 'user' to use sudo."
            continue
          }

          $setupDone = $true
          break
        }
        if ( -not $setupDone ) {
          Write-Error "Cannot set up WSL instance."
          exit 1
        }

    - name: Setup symlink for accessing GitHub workspace from WSL
      shell: pwsh
      id: setup-workspace-symlink
      env:
        WSL_DISTRO_NAME: ${{ inputs.wsl-distro-name }}
      run: |
        Set-StrictMode -version latest

        Write-Output "Workspace is at ${Env:GITHUB_WORKSPACE} (on Windows)"
        $workspacePath = wsl --exec wslpath -u "${Env:GITHUB_WORKSPACE}".Replace('\', '\\')
        Write-Output "Workspace is at $workspacePath (on Linux)"

        Write-Output "Creating a symlink for accessing GitHub workspace from WSL."
        wsl `
          --distribution "${Env:WSL_DISTRO_NAME}" `
          --user root `
          --cd / `
          ln -s "$workspacePath" /srv/github-workspace
        if ( ! $? ) {
          Write-Error "Cannot create symlink for accessing GitHub workspace from WSL."
          exit 1
        }
        wsl `
          --distribution "${Env:WSL_DISTRO_NAME}" `
          --user root `
          --cd / `
          ls -ld /srv/github-workspace
        wsl `
          --distribution "${Env:WSL_DISTRO_NAME}" `
          --user root `
          --cd / `
          ls -ld "$workspacePath"

        Add-Content -LiteralPath ${Env:GITHUB_OUTPUT} -Value "wsl-workspace-path=/srv/github-workspace"
