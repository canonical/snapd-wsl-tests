name: Install WSL
author: Zygmunt Krynicki
description: |
  Install or upgrade WSL to the specified release. The release assets are
  looked up via the GitHub Releases API for microsoft/WSL.
inputs:
  wsl-version:
    description: WSL version to install (e.g. 2.6.3)
    required: false
    default: "2.6.3"
  wsl-installer-url:
    description: Override the MSI download URL (optional; disables MSI caching)
    required: false
    default: ""
  # Remaining inputs describe the .wslconfig file:
  # https://learn.microsoft.com/en-us/windows/wsl/wsl-config
  # Only a small subset is implemented, as needed.
  wslconfig-kernel:
    description: Path to the Linux kernel file stored on the Windows file system
    required: false
    default: ""
  wslconfig-kernel-command-line:
    description: Additional kernel command line arguments
    required: false
    default: ""
  wslconfig-vm-idle-timeout:
    description: Number of milliseconds to wait before shutting down an idle instance
    required: false
    default: ""
branding:
  icon: download
  color: orange
runs:
  using: composite
  steps:
    - name: Cache WSL MSI installer
      if: ${{ inputs.wsl-installer-url == '' }}
      id: cache-wsl-msi
      uses: actions/cache@v5
      with:
        path: .wsl-msi-cache/
        key: wsl-msi-${{ inputs.wsl-version }}-${{ runner.arch }}

    - name: Install/Upgrade WSL and write .wslconfig
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
        WSL_VERSION: ${{ inputs.wsl-version }}
        WSL_INSTALLER_URL: ${{ inputs.wsl-installer-url }}
        WSL_MSI_CACHE_DIR: .wsl-msi-cache
        WSLCONFIG_VM_IDLE_TIMEOUT: ${{ inputs.wslconfig-vm-idle-timeout }}
        WSLCONFIG_KERNEL: ${{ inputs.wslconfig-kernel }}
        WSLCONFIG_KERNEL_COMMAND_LINE: ${{ inputs.wslconfig-kernel-command-line }}
      run: |
        Set-StrictMode -version latest
        go run ./cmd/install-wsl
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
