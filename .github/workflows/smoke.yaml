name: Smoke
run-name: Smoke test with snapd from channel ${{ inputs.snapd-snap-channel }} or revision ${{ inputs.snapd-snap-revision }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      snapd-snap-revision:
        description: "Specific revision of snapd to use (0 uses channel)"
        type: number
        default: 0
      snapd-snap-channel:
        description: "Specific channel of snapd to use"
        type: choice
        options:
          - latest/stable
          - latest/candidate
          - latest/beta
          - latest/edge
        default: latest/stable

jobs:
  ubuntu:
    name: "Ubuntu ${{ matrix.version-id }}"
    strategy:
      matrix:
        lts: [false]
        wsl-enable-systemd: [false]
        include:
          - codename: jammy
            version-id: "22.04"
            wsl-enable-systemd: true
            wsl-rootfs-url: https://cloud-images.ubuntu.com/wsl/jammy/current/ubuntu-jammy-wsl-amd64-ubuntu22.04lts.rootfs.tar.gz
            wsl-rootfs-file: ubuntu-jammy-wsl-amd64-ubuntu22.04lts.rootfs.tar.gz
          - codename: noble
            version-id: "24.04"
            wsl-rootfs-url: https://cdimage.ubuntu.com/ubuntu-wsl/noble/daily-live/current/noble-wsl-amd64.wsl
            wsl-rootfs-file: noble-wsl-amd64.wsl
          - codename: resolute
            version-id: "26.04"
            wsl-rootfs-url: https://cdimage.ubuntu.com/ubuntu-wsl/resolute/daily-live/current/resolute-wsl-amd64.wsl
            wsl-rootfs-file: resolute-wsl-amd64.wsl
    uses: ./.github/workflows/generic.yaml
    with:
      distro-name: Ubuntu ${{ matrix.version-id }}
      wsl-rootfs-url: ${{ matrix.wsl-rootfs-url }}
      wsl-rootfs-file: ${{ matrix.wsl-rootfs-file }}
      wsl-distro-name: Test-Ubuntu-${{ matrix.version-id }}
      wsl-enable-systemd: ${{ matrix.wsl-enable-systemd }}
      snapd-snap-revision: ${{ github.event.inputs.snapd-snap-revision != 0 && fromJSON(github.event.inputs.snapd-snap-revision) || 0 }}
      snapd-snap-channel: ${{ github.event.inputs.snapd-snap-channel != '' && github.event.inputs.snapd-snap-channel || 'latest/stable' }}
